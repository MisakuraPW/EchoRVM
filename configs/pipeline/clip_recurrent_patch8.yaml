# Spatial-budget development recipe, not an EchoCardMAE reproduction/ablation.
version: 1
adapter: research_pipeline.spatial_baseline:build
run: {root: /root/autodl-fs/outputs_cr_spatial, tag: cr_patch8_w64_400_v1}
data:
  manifest: /root/autodl-fs/outputs_cr_spatial/manifests/dynamic_w64_h0_tasks.json
  ssl_manifest: /root/autodl-fs/outputs_cr_spatial/manifests/dynamic_w64_h0_ssl.json
  local_frames: 16
  recent_frames: 64
  max_prefix: 0
  prefix: 0
  diagnostic_cases: 64
  seed: 42
  val_positions: all
  augmentation: {enabled: false}
model:
  init_checkpoint: ckpt/mae/videomae_vit_s.pth
  overrides: {}
  config:
    img_size: 112
    patch_size: 8
    in_chans: 3
    local_frames: 16
    clip_count: 4
    tubelet_size: 2
    embed_dim: 384
    depth: 12
    num_heads: 6
    decoder_embed_dim: 192
    decoder_depth: 4
    decoder_num_heads: 3
    position_embedding: flat_sinusoid
    separate_qv_bias: true
    decoder_embed_bias: false
    norm_eps: 0.000001
    mask_ratio: 0.9
    mask_strategy: tube
    research_mask: tube
    norm_pix_loss: true
    input_mean: [0.485, 0.456, 0.406]
    input_std: [0.229, 0.224, 0.225]
    drop_path_rate: 0.0
    memory_mode: global
    core_depth: 1
    memory_compression: mean
    memory_write_source: fused
    memory_read_location: tokens
    frame_readout: repeat
    allow_variable_context: true
    reconstruction_recent_frames: 64
    candidate_rank: 0
    dynamic_orthogonal_weight: 0.0
    frequency_conditioned: false
    frequency_loss_weight: 0.0
runtime:
  device: cuda
  precision: bf16
  autotune: true
  micro_batch: 4
  batch_candidates: [1, 2, 4, 8, 16, 32, 64]
  worker_candidates: [0, 2, 4, 8]
  checkpoint_candidates: [false, true]
  cache_gb: 28
  min_free_gb: 3
  evict_completed_feature_caches: true
training:
  seed: 42
  epochs: 100
  effective_batch: 32
  lr: 0.0001
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 5
  lr_schedule: cosine
  clip_norm: 1.0
  eval_every: 1
  patience: 10
  min_delta: 0.0001
  checkpoint_every: 25
  resume_every: 1
  keep_snapshots: 0
  tensorboard: true
evaluation:
  boundaries: true
  cache_frozen: true
  representation_max_samples: 128
  representation_interventions: true
stages:
  - id: pretrain
    kind: mae
    training:
      epochs: 400
      effective_batch: 64
      betas: [0.9, 0.95]
      warmup_epochs: 40
      patience: null
      min_delta: 0.0
      eval_every: 25
      save_epochs: [0, 100, 200, 400]
  - {id: repr_0000, kind: representation, readout_task: ef, mode: frozen_linear, source: '@pretrain/epoch_0000'}
  - {id: repr_0400, kind: representation, readout_task: ef, mode: frozen_linear, source: '@pretrain/epoch_0400'}
  - {id: ef_linear_0400, kind: ef, mode: frozen_linear, source: '@pretrain/epoch_0400'}
  - {id: seg_linear_0400, kind: seg, mode: frozen_linear, source: '@pretrain/epoch_0400'}
  - id: seg_decoder_transfer_ft
    kind: seg
    mode: finetune
    source: '@pretrain/epoch_0400'
    data:
      augmentation: {enabled: true, preset: A4_tgc_zoom_speckle, per_frame_random: false}
    training: {weight_decay: 0.0001, lr_schedule: constant, warmup_epochs: 0}
  - id: ef_l1_ft
    kind: ef
    mode: finetune
    source: '@pretrain/epoch_0400'
    data:
      augmentation: {enabled: true, preset: A4_tgc_zoom_speckle, per_frame_random: false}
    training: {lr: 0.00001, weight_decay: 0.0001, lr_schedule: constant, warmup_epochs: 0}
