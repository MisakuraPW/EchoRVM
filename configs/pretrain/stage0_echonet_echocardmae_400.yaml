experiment:
  name: echonet_echocardmae_repro
  description: "Stage-0 EchoCardMAE-style single-frame MAE trajectory on EchoNet, 0-400 epochs."
  seed: 42
  output_root: /root/autodl-tmp/outputs

data:
  loader: echonet
  dataset_name: EchoNet-Dynamic
  data_root: /root/autodl-tmp/datasets/EchoNet-Dynamic
  train_split: train
  val_split: val
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true

augment:
  enabled: true
  preset: A4_tgc_zoom_speckle
  per_frame_random: false
  img_size: 112
  tgc_prob: 0.4
  gamma_contrast_prob: 0.5
  brightness_prob: 0.3
  zoom_prob: 0.3
  blur_prob: 0.2
  speckle_prob: 0.4
  shadow_prob: 0.0
  tgc_min: 0.75
  tgc_max: 1.35
  gamma_min: 0.75
  gamma_max: 1.35
  contrast_min: 0.85
  contrast_max: 1.20
  brightness_delta: 0.08
  zoom_min: 0.92
  zoom_max: 1.12
  speckle_sigma_min: 0.03
  speckle_sigma_max: 0.10

model:
  name: echo_single_frame_mae
  init_checkpoint: ckpt/mae/videomae_vit_s.pth
  require_init_min_tensors: 100
  img_size: 112
  patch_size: 8
  frames: 1
  in_chans: 1
  embed_dim: 384
  depth: 12
  num_heads: 6
  decoder_embed_dim: 192
  decoder_depth: 4
  decoder_num_heads: 3
  mask_ratio: 0.75
  auto_roi: true
  roi_threshold: 0.01
  roi_min_fraction: 0.05
  median_blur_kernel: 5
  norm_pix_loss: false
  drop_path_rate: 0.05
  baseline_family: echocardmae_repro

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.05

scheduler:
  name: cosine
  warmup_epochs: 10
  min_lr: 1.0e-6

train:
  epochs: 400
  batch_size: 128
  grad_accum_steps: 1
  mixed_precision: true
  channels_last: false
  torch_compile: false
  gradient_checkpointing: false
  clip_grad_norm: 1.0
  log_interval: 20
  val_interval: 1
  plot_interval: 1
  max_steps: null
  stop_on_nan: true

checkpoint:
  resume: null
  auto_resume: true
  save_last: true
  save_best: true
  save_every_n_epochs: 0
  save_epochs: [50, 100, 150, 200, 250, 300, 350, 400, 600, 800, 1200, 1600]
  epoch_name_width: 4
  save_eval_optimizer_state: false
  monitor: val_loss
  mode: min

logging:
  use_tqdm: true
  use_tensorboard: true
  save_jsonl: true
  save_csv: true
  save_plots: true

early_stopping:
  enabled: false
  patience: 20
  min_delta: 1.0e-4
