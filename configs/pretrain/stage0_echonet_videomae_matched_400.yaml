experiment:
  name: echonet_videomae_matched
  description: "Matched 16-frame VideoMAE control trajectory on EchoNet, 0-400 epochs."
  seed: 42
  output_root: /root/autodl-tmp/outputs
data:
  loader: echonet
  dataset_name: EchoNet-Dynamic
  data_root: /root/autodl-tmp/datasets/EchoNet-Dynamic
  train_split: train
  val_split: val
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true
augment:
  enabled: false
  img_size: 112
model:
  name: echo_videomae
  baseline_family: videomae_clean_video
  init_checkpoint: ckpt/mae/videomae_vit_s.pth
  require_init_min_tensors: 100
  img_size: 112
  patch_size: 8
  frames: 16
  sampling_rate: 4
  two_views: true
  in_chans: 3
  embed_dim: 384
  depth: 12
  num_heads: 6
  decoder_embed_dim: 192
  decoder_depth: 4
  decoder_num_heads: 3
  tubelet_size: 2
  mask_ratio: 0.75
  mask_strategy: random
  median_blur_kernel: 3
  align_loss_weight: 0.2
  alignment_temperature: 0.1
  norm_pix_loss: false
  drop_path_rate: 0.0
  input_mean: [0.1257, 0.1271, 0.1292]
  input_std: [0.1951, 0.1957, 0.1974]
optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
scheduler:
  name: none
train:
  epochs: 400
  batch_size: 32
  grad_accum_steps: 4
  mixed_precision: true
  clip_grad_norm: 1.0
  log_interval: 20
  val_interval: 1
  plot_interval: 1
  stop_on_nan: true
checkpoint:
  auto_resume: true
  save_last: true
  save_best: true
  save_epochs: [50, 100, 150, 200, 250, 300, 350, 400]
  epoch_name_width: 4
  save_eval_optimizer_state: false
  monitor: val_loss
  mode: min
logging:
  use_tqdm: true
  use_tensorboard: true
  save_jsonl: true
  save_csv: true
  save_plots: true
early_stopping:
  enabled: false